# Hand-labelled sentences for case PB-022 (both results; facts in docs/results/report.md).
# `correct: true` means a careful human reviewer would accept the sentence; the checker
# should find no violation. `correct: false` means it states a wrong or unsupported number.
# Flagged correct sentences are false positives, unflagged wrong ones are false negatives.
# Includes the elliptical and other fail-closed phrasings observed in the comparison runs.
